service: attri-nexus-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'ap-south-1'} # Default: Mumbai (Fastest for India/Asia/Gulf)
  memorySize: 512
  timeout: 15
  # No gateway-level CORS: preflights reach Express, whose allowlist
  # (CORS_ORIGIN) decides. `cors: true` here would allow every origin.
  environment:
    NODE_ENV: production
    # No fallback: a missing secret must fail the deploy, never ship a guessable one.
    JWT_SECRET: ${env:JWT_SECRET}
    MONGODB_URI: ${env:MONGODB_URI, ''}
    # Comma-separated list of the exact site origins, e.g. https://attrinexus.com
    CORS_ORIGIN: ${env:CORS_ORIGIN}
    CLOUDINARY_URL: ${env:CLOUDINARY_URL, ''}
    CLOUDINARY_CLOUD_NAME: ${env:CLOUDINARY_CLOUD_NAME, ''}
    CLOUDINARY_API_KEY: ${env:CLOUDINARY_API_KEY, ''}
    CLOUDINARY_API_SECRET: ${env:CLOUDINARY_API_SECRET, ''}
    TURNSTILE_SECRET_KEY: ${env:TURNSTILE_SECRET_KEY, ''}
    RESEND_API_KEY: ${env:RESEND_API_KEY, ''}
    ADMIN_NOTIFICATION_EMAIL: ${env:ADMIN_NOTIFICATION_EMAIL, ''}
    FROM_EMAIL: ${env:FROM_EMAIL, 'Attri Nexus <onboarding@resend.dev>'}

functions:
  api:
    handler: src/lambda.handler
    events:
      - httpApi:
          path: '/{proxy+}'
          method: '*'
      - httpApi:
          path: '/'
          method: '*'

package:
  patterns:
    - '!test/**'
    - '!.git/**'
    - '!node_modules/mongodb-memory-server/**'
