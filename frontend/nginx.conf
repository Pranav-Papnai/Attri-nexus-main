server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Security Headers.
    # nginx drops every server-level add_header in any location that declares
    # its own add_header, so locations below must not use add_header.
    #
    # CSP: scripts only from this origin plus Cloudflare Turnstile. Inline
    # styles are allowed because the animation library writes style attributes;
    # images allow any https source because product images are admin-supplied
    # URLs (Cloudinary or elsewhere) or uploaded data: URIs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    # The legacy XSS auditor is removed from modern browsers and could be
    # abused to selectively disable scripts in old ones; CSP replaces it.
    add_header X-XSS-Protection "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Healthcheck
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Reverse Proxy for API requests to the backend container
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        # The API uses no websockets, so upgrade requests are never forwarded
        # (prevents h2c request smuggling). A fixed Host means the client's
        # Host header never reaches the API.
        proxy_set_header Connection "";
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # Cache static assets. `expires` sets Cache-Control itself, so the
    # security headers above still apply here.
    location /assets/ {
        expires 1y;
    }

    # Image filenames are not content-hashed, so a replaced image can take up to
    # a week to reach returning visitors.
    location /images/ {
        expires 7d;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
