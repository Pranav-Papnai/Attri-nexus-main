services:
  # ==========================================
  # Public entry point: TLS termination (Caddy)
  # Set SITE_ADDRESS=yourdomain.com in .env for automatic HTTPS; see Caddyfile.
  # ==========================================
  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: attri-nexus-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    mem_limit: 256m
    cpus: 0.5
    networks:
      - attri-network

  # ==========================================
  # Frontend Service (Vite React + Nginx)
  # ==========================================
  frontend:
    # Pulled from Docker Hub. CI deploys the exact commit it built
    # (IMAGE_TAG=<git sha>); without IMAGE_TAG the newest :latest is pulled.
    # `docker compose up --build` builds from source instead.
    image: akashiseijuro23/attri-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attri-nexus-frontend
    restart: always
    # Reached only through Caddy; publishing it would bypass HTTPS.
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    networks:
      - attri-network

  # ==========================================
  # Backend API Service (Express + Node.js)
  # ==========================================
  backend:
    image: akashiseijuro23/attri-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attri-nexus-backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Caddy -> nginx -> backend. Must equal the number of proxies in front.
      - TRUST_PROXY_HOPS=2
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL}
      - FROM_EMAIL=${FROM_EMAIL:-Attri Nexus <onboarding@resend.dev>}
    # No published port: the API is reachable only through Caddy and the
    # frontend's nginx (/api/). Exposing 3001 directly would let clients forge
    # X-Forwarded-For and dodge every per-IP rate limit and lockout.
    expose:
      - "3001"
    # Forwards stop signals and reaps zombies (the image has no dumb-init).
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - attri-network

  # ==========================================
  # Optional local MongoDB, for running without Atlas.
  # Starts only when asked for:  docker compose --profile local-db up -d
  # ==========================================
  mongodb:
    image: mongo:7.0@sha256:9650758f83af117fc96699f030a44f9300bed839734e67012f56df05b2fd6290
    container_name: attri-nexus-mongodb
    restart: always
    profiles: ["local-db"]
    # Refuses to start without credentials, so the database can never run
    # unauthenticated. MONGODB_URI must then carry them, e.g.
    # mongodb://USER:PASS@mongodb:27017/attri_nexus?authSource=admin
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$$MONGO_INITDB_ROOT_USERNAME" ] || [ "$${#MONGO_INITDB_ROOT_PASSWORD}" -lt 16 ]; then
        echo 'Set MONGO_ROOT_USERNAME and a MONGO_ROOT_PASSWORD of at least 16 characters in .env' >&2; exit 1; fi;
        exec docker-entrypoint.sh mongod --auth
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    cpus: 1.0
    networks:
      - attri-network

volumes:
  mongo_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  attri-network:
    driver: bridge
