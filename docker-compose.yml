services:
  # ==========================================
  # Frontend Service (Vite React + Nginx)
  # ==========================================
  frontend:
    image: akashiseijuro23/attri-frontend:v1
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attri-nexus-frontend
    restart: always
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - attri-network

  # ==========================================
  # Backend API Service (Express + Node.js)
  # ==========================================
  backend:
    image: akashiseijuro23/attri-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attri-nexus-backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL}
      - FROM_EMAIL=${FROM_EMAIL:-Attri Nexus <onboarding@resend.dev>}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - attri-network

  # ==========================================
  # Database Service (Local MongoDB fallback)
  # (Can be skipped if using MongoDB Atlas cloud URI)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: attri-nexus-mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - attri-network

volumes:
  mongo_data:
    driver: local

networks:
  attri-network:
    driver: bridge
