services:
  # ==========================================
  # Public entry point: TLS termination (Caddy)
  # Set SITE_ADDRESS=yourdomain.com in .env for automatic HTTPS; see Caddyfile.
  # ==========================================
  caddy:
    image: caddy:2.8-alpine
    container_name: attri-nexus-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - attri-network

  # ==========================================
  # Frontend Service (Vite React + Nginx)
  # ==========================================
  frontend:
    image: akashiseijuro23/attri-frontend:v1
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attri-nexus-frontend
    restart: always
    # Reached only through Caddy; publishing it would bypass HTTPS.
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - attri-network

  # ==========================================
  # Backend API Service (Express + Node.js)
  # ==========================================
  backend:
    image: akashiseijuro23/attri-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attri-nexus-backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Caddy -> nginx -> backend. Must equal the number of proxies in front.
      - TRUST_PROXY_HOPS=2
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL}
      - FROM_EMAIL=${FROM_EMAIL:-Attri Nexus <onboarding@resend.dev>}
    # No published port: the API is reachable only through Caddy and the
    # frontend's nginx (/api/). Exposing 3001 directly would let clients forge
    # X-Forwarded-For and dodge every per-IP rate limit and lockout.
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - attri-network

  # ==========================================
  # Database Service (Local MongoDB fallback)
  # (Can be skipped if using MongoDB Atlas cloud URI)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: attri-nexus-mongodb
    restart: always
    # Enables authentication when both are set in .env. Only takes effect when
    # the data volume is first created; MONGODB_URI must then carry them, e.g.
    # mongodb://USER:PASS@mongodb:27017/attri_nexus?authSource=admin
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
    networks:
      - attri-network

volumes:
  mongo_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  attri-network:
    driver: bridge
