name: CI/CD Pipeline - Attri Nexus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_USER: akashiseijuro23
  BACKEND_IMAGE: akashiseijuro23/attri-backend
  FRONTEND_IMAGE: akashiseijuro23/attri-frontend

jobs:
  # ========================================================
  # 1. Test & Build Validation (Frontend + Backend)
  # ========================================================
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Syntax/Check
        working-directory: ./backend
        run: node -c src/index.js

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '' }}
        run: npm run build

  # ========================================================
  # 2. Build and Push Docker Images to Docker Hub
  # ========================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract Docker Metadata for Backend
      - name: Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1
            type=sha,prefix=,format=short

      # Build and Push Backend Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract Docker Metadata for Frontend
      - name: Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1
            type=sha,prefix=,format=short

      # Build and Push Frontend Image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 3. Automated CD Deployment to AWS EC2
  # ========================================================
  deploy-ec2:
    name: Deploy to AWS EC2 Instance
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify EC2 Secrets
        id: check-ec2-secrets
        run: |
          HOST="${{ secrets.EC2_HOST || secrets.SERVER_HOST }}"
          KEY="${{ secrets.EC2_SSH_KEY || secrets.SERVER_SSH_KEY }}"
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "AWS EC2 secrets detected. Proceeding with deployment."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::Skipping EC2 deployment. Please configure EC2_HOST and EC2_SSH_KEY in GitHub Repository Secrets."
          fi

      - name: Prepare Deployment Directory on EC2
        if: steps.check-ec2-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.EC2_USER || secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || secrets.SERVER_PORT || '22' }}
          script: |
            mkdir -p ${{ secrets.EC2_APP_DIR || '~/attri-nexus' }}

      - name: Copy docker-compose.yml and Caddyfile to EC2
        if: steps.check-ec2-secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.EC2_USER || secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || secrets.SERVER_PORT || '22' }}
          source: "docker-compose.yml,Caddyfile"
          target: ${{ secrets.EC2_APP_DIR || '~/attri-nexus' }}

      - name: Execute Docker Compose Deploy on EC2
        if: steps.check-ec2-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.EC2_USER || secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || secrets.SERVER_PORT || '22' }}
          script: |
            cd ${{ secrets.EC2_APP_DIR || '~/attri-nexus' }}

            echo "=== 1. Logging into Docker Hub (if token provided) ==="
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME || env.DOCKER_USER }}" --password-stdin
            fi

            echo "=== 2. Pulling latest images from Docker Hub ==="
            docker compose pull

            echo "=== 3. Starting updated containers in detached mode ==="
            docker compose up -d --remove-orphans

            echo "=== 4. Checking container health status ==="
            docker compose ps

            echo "=== 5. Cleaning dangling images to save EC2 disk space ==="
            docker image prune -af --filter "until=24h"

            echo "🚀 Deployment to AWS EC2 completed successfully!"
