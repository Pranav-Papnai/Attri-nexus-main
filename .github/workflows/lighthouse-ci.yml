name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse CI
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: cd frontend && npm install && npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.11.x

      - name: Start preview server
        run: |
          cd frontend
          # Kill any process using port 4173
          lsof -ti:4173 | xargs kill -9 2>/dev/null || true
          sleep 1

          # Start preview server (no timeout - let it run during test)
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/preview.log 2>&1 &

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:4173 > /dev/null 2>&1; then
              echo "✓ Preview server ready on port 4173"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done

          if ! curl -s http://localhost:4173 > /dev/null 2>&1; then
            echo "✗ Server startup failed"
            tail -50 /tmp/preview.log
            exit 1
          fi
        env:
          VITE_BACKEND_API_URL: http://localhost:3000/api

      - name: Run Lighthouse CI
        run: lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
