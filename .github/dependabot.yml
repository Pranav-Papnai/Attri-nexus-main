# Weekly update PRs for dependencies, base-image digests and pinned actions.
# The cooldown waits a week after a release before proposing it, so a
# hijacked package version is usually caught and pulled before it reaches us.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
  # Node majors are skipped: odd releases (23, 25) are never LTS, and moving
  # to the next LTS is a deliberate change (Dockerfiles, CI, engines together).
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  # A MongoDB major upgrade changes the on-disk data format of the bundled
  # database, so it is done deliberately, not from a weekly bump.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: mongo
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
